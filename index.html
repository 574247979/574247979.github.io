<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old-Cheung's blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .search-container {
            margin: 20px 0;
        }

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .blog-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .blog-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .blog-card-header {
            height: 200px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .blog-card-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/><circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></svg>');
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .blog-card-content {
            padding: 25px;
        }

        .blog-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .blog-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }

        .blog-excerpt {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .blog-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .article-view {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .article-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .article-title {
            font-size: 2.2em;
            color: #333;
            margin-bottom: 15px;
        }

        .article-meta {
            color: #666;
            font-size: 1.1em;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .article-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #444;
        }

        .article-content h2 {
            color: #667eea;
            margin: 30px 0 15px 0;
            font-size: 1.5em;
        }

        .article-content p {
            margin-bottom: 20px;
        }

        .article-content code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #e83e8c;
        }

        .back-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .about-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .about-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .about-content p {
            font-size: 1.1em;
            line-height: 1.8;
            color: #555;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-link {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .blog-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-tabs {
                flex-wrap: wrap;
            }
            
            .article-view {
                padding: 20px;
            }
            
            .about-content {
                padding: 20px;
            }
            
            .social-links {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的技术博客</h1>
            <p class="subtitle">分享技术见解，记录学习历程</p>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="搜索文章..." id="searchInput">
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="showSection('home')">首页</button>
            <button class="tab-btn" onclick="showSection('about')">关于</button>
        </nav>

        <main>
            <div id="home" class="content-section active">
                <div class="blog-grid" id="blogGrid">
                    <!-- 博客文章将通过JavaScript动态生成 -->
                </div>
            </div>

            <div id="about" class="content-section">
                <div class="about-content">
                    <h2>关于我</h2>
                    <p>欢迎来到我的技术博客！我是一名充满热情的开发者，专注于前端技术、后端开发和软件架构设计。</p>
                    <p>在这里，我会分享我的技术学习心得、项目经验、以及对技术发展趋势的思考。希望我的文章能够帮助到其他开发者，也欢迎大家与我交流讨论。</p>
                    <p>如果你对我的文章有任何问题或建议，随时欢迎联系我！</p>
                    <div class="social-links">
                        <a href="#" class="social-link">GitHub</a>
                        <a href="#" class="social-link">Twitter</a>
                        <a href="#" class="social-link">LinkedIn</a>
                    </div>
                </div>
            </div>

            <div id="article" class="content-section">
                <button class="back-btn" onclick="showSection('home')">← 返回首页</button>
                <div class="article-view" id="articleView">
                    <!-- 文章内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2023 我的技术博客. 托管于 GitHub Pages</p>
        </footer>
    </div>

    <script>
        // 博客文章数据
        const blogPosts = [
            {
                id: 1,
                title: "现代前端框架对比：React vs Vue vs Angular",
                excerpt: "深入分析三大前端框架的优缺点，帮助开发者选择最适合项目的框架。从性能、学习曲线、生态系统等多个维度进行全面比较。",
                content: `
                    <h2>框架概述</h2>
                    <p>React、Vue和Angular作为当今最流行的前端框架，各自都有独特的优势和适用场景。本文将从多个维度对这三个框架进行深入比较。</p>
                    
                    <h2>性能对比</h2>
                    <p>在性能方面，React通过虚拟DOM和高效的diff算法实现了出色的渲染性能。Vue在保持简洁API的同时，也提供了优秀的性能表现。Angular虽然功能强大，但在小型项目中可能存在过度设计的问题。</p>
                    
                    <h2>学习曲线</h2>
                    <p>Vue以其简单直观的API设计著称，学习曲线相对平缓。React需要理解JSX和组件生命周期，但概念相对清晰。Angular的学习曲线最为陡峭，需要掌握TypeScript、依赖注入等复杂概念。</p>
                    
                    <h2>生态系统</h2>
                    <p>React拥有最庞大的生态系统，第三方库和工具链极其丰富。Vue的生态系统虽然相对较小，但质量很高。Angular提供了完整的解决方案，内置了大多数开发所需的功能。</p>
                `,
                date: "2025-01-15",
                author: "张三",
                tags: ["前端", "React", "Vue", "Angular"],
                category: "技术分享"
            },
            {
                id: 2,
                title: "Node.js 微服务架构实践指南",
                excerpt: "从零开始构建Node.js微服务架构，包括服务发现、API网关、分布式跟踪等关键技术的实现。",
                content: `
                    <h2>微服务架构概述</h2>
                    <p>微服务架构是一种将单一应用程序分解为多个小型、独立服务的架构模式。每个服务运行在自己的进程中，通过轻量级通信机制进行交互。</p>
                    
                    <h2>Node.js的优势</h2>
                    <p>Node.js在微服务架构中具有天然优势：单线程事件循环模型使其在处理I/O密集型任务时表现出色，丰富的npm生态系统提供了大量工具支持。</p>
                    
                    <h2>服务发现机制</h2>
                    <p>在微服务架构中，服务发现是关键组件。我们可以使用Consul、Eureka或etcd等工具实现服务注册与发现。通过健康检查确保服务的可用性。</p>
                    
                    <h2>API网关设计</h2>
                    <p>API网关作为系统的入口点，负责路由、认证、限流等功能。推荐使用Kong、Zuul或自研网关来实现统一的API管理。</p>
                `,
                date: "2025-01-10",
                author: "李四",
                tags: ["Node.js", "微服务", "后端", "架构"],
                category: "架构设计"
            },
            {
                id: 3,
                title: "TypeScript 高级特性深度解析",
                excerpt: "探索TypeScript的高级特性，包括泛型、装饰器、条件类型等，提升代码的类型安全性和开发效率。",
                content: `
                    <h2>泛型的威力</h2>
                    <p>泛型是TypeScript中最强大的特性之一，它允许我们编写可重用的代码组件。通过泛型，我们可以创建适用于多种类型的函数和类。</p>
                    
                    <h2>装饰器模式</h2>
                    <p>装饰器提供了一种在不修改原有代码的情况下扩展功能的方式。在Angular和NestJS等框架中，装饰器被广泛使用。</p>
                    
                    <h2>条件类型</h2>
                    <p>条件类型允许我们根据类型条件选择不同的类型，这在创建复杂类型工具时非常有用。结合映射类型，可以实现强大的类型转换。</p>
                    
                    <h2>实际应用案例</h2>
                    <p>通过实际项目案例，演示如何使用这些高级特性构建类型安全的应用程序，提高开发效率和代码质量。</p>
                `,
                date: "2025-01-05",
                author: "王五",
                tags: ["TypeScript", "前端", "类型系统"],
                category: "技术分享"
            },
            {
                id: 4,
                title: "Docker 容器化部署最佳实践",
                excerpt: "详细介绍Docker容器化部署的最佳实践，包括镜像优化、安全配置、多阶段构建等关键技术。",
                content: `
                    <h2>容器化的优势</h2>
                    <p>Docker容器化技术解决了"在我机器上能运行"的问题，提供了一致的运行环境。通过容器化，我们可以实现应用的快速部署和扩展。</p>
                    
                    <h2>镜像优化策略</h2>
                    <p>优化Docker镜像大小对于提高部署效率至关重要。使用多阶段构建、选择合适的基础镜像、清理不必要的文件都是有效的优化方法。</p>
                    
                    <h2>安全配置要点</h2>
                    <p>容器安全不容忽视。使用非root用户运行容器、限制容器权限、定期更新基础镜像都是保障容器安全的重要措施。</p>
                    
                    <h2>生产环境部署</h2>
                    <p>在生产环境中部署容器应用需要考虑高可用性、监控告警、日志收集等因素。Kubernetes等容器编排工具能够帮助管理复杂的容器集群。</p>
                `,
                date: "2024-12-28",
                author: "赵六",
                tags: ["Docker", "容器", "部署", "DevOps"],
                category: "运维技术"
            }
        ];

        let filteredPosts = [...blogPosts];

        // 渲染博客列表
        function renderBlogList() {
            const blogGrid = document.getElementById('blogGrid');
            blogGrid.innerHTML = '';

            filteredPosts.forEach(post => {
                const blogCard = document.createElement('div');
                blogCard.className = 'blog-card';
                blogCard.onclick = () => showArticle(post.id);
                
                blogCard.innerHTML = `
                    <div class="blog-card-header">
                        ${post.category}
                    </div>
                    <div class="blog-card-content">
                        <h3>${post.title}</h3>
                        <div class="blog-meta">
                            <span>📅 ${post.date}</span>
                            <span>👤 ${post.author}</span>
                        </div>
                        <p class="blog-excerpt">${post.excerpt}</p>
                        <div class="blog-tags">
                            ${post.tags.map(tag => `<span class="tag" onclick="filterByTag('${tag}', event)">${tag}</span>`).join('')}
                        </div>
                    </div>
                `;
                
                blogGrid.appendChild(blogCard);
            });
        }

        // 显示文章详情
        function showArticle(id) {
            const post = blogPosts.find(p => p.id === id);
            if (!post) return;

            const articleView = document.getElementById('articleView');
            articleView.innerHTML = `
                <div class="article-header">
                    <h1 class="article-title">${post.title}</h1>
                    <div class="article-meta">
                        <span>📅 ${post.date}</span>
                        <span>👤 ${post.author}</span>
                        <span>📂 ${post.category}</span>
                    </div>
                </div>
                <div class="article-content">
                    ${post.content}
                </div>
                <div class="blog-tags" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                    ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
            `;

            showSection('article');
        }

        // 切换页面部分
        function showSection(sectionId) {
            // 隐藏所有部分
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // 更新标签页按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示指定部分
            document.getElementById(sectionId).classList.add('active');
            
            // 更新对应的标签页按钮
            if (sectionId !== 'article') {
                document.querySelector(`[onclick="showSection('${sectionId}')"]`).classList.add('active');
            }
        }

        // 按标签筛选
        function filterByTag(tag, event) {
            event.stopPropagation();
            filteredPosts = blogPosts.filter(post => post.tags.includes(tag));
            renderBlogList();
        }

        // 搜索功能
        function searchPosts(query) {
            const searchTerm = query.toLowerCase();
            filteredPosts = blogPosts.filter(post => 
                post.title.toLowerCase().includes(searchTerm) ||
                post.excerpt.toLowerCase().includes(searchTerm) ||
                post.tags.some(tag => tag.toLowerCase().includes(searchTerm))
            );
            renderBlogList();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderBlogList();
            
            // 搜索输入监听
            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchPosts(e.target.value);
            });
        });
    </script>
</body>
</html>
